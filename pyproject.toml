[project]
name = "eta-skills-tools"
version = "0.0.0"
description = "Repo tooling for eta-skills (validation, catalog, packaging)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[dependency-groups]
dev = ["skills-ref"]

[tool.uv]
package = false

[tool.uv.sources]
# skills-ref has no PyPI release; pinned to a commit of agentskills/agentskills.
skills-ref = { git = "https://github.com/agentskills/agentskills", subdirectory = "skills-ref", rev = "69ef37e9424c0a7ea9dd2293b559e43ec8176379" }
